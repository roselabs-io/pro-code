# The dispatcher's config for pro-code. `governor/settings/settings.py` in the Governor package describes every key
# and its default.

name: "pro-code"
repo: "roselabs-io/pro-code"
checkout: .
qa_owner: "Patrick Saint-Denis"
runtime_paths: [pipeline.yaml, justfile, tools/]

markers:
  prefix: "procode"

ci:
  workflow: "procode-ci.yml"
  run_title: "pro-code CI PR #{number} {head}"
  runner_labels: ["ubuntu-latest"]

gate:
  command: just gate

# The merge gate (`governor/docs/service/merge-queue.md`, Merge policy): `full` merges every approved PR through
# the merge queue, `tiered` leaves the merge of a complex or exceptional ticket's PR to a person, `gated` leaves
# every merge to a person. Whether a merge deploys is decided by this repository's own CI/CD.
autonomy: full

checks:
  recipes:
    not_applicable: {"up": "the site has no local server", "down": "the site has no local server", "logs": "the site has no local server", "test": "no test suite at the root; the examples' tests need dependencies that are not locked and, for roselabs-blog, Postgres and a browser"}

  # `secrets`: the offline scan of `tools/secret_scan.py` against `.secrets.baseline`, run by the posture check runner.
  # It needs detect-secrets 1.5.0 in uv's cache (`just prepare`).
  commands:
    secrets: [uv, run, --offline, --no-project, --with, "detect-secrets==1.5.0", python, tools/secret_scan.py]

# The three documents below name AGENTS.md; `docs.operating_model` must hold a "Finding triage" section.
docs:
  agents: AGENTS.md
  contract: AGENTS.md
  review_posture: AGENTS.md
  operating_model: AGENTS.md

tickets:
  project: "Governor"
  project_number: 2
  fields:
    horizon:
      name: Horizon
      options: [Now, Next, Later]
      colors: [BLUE, YELLOW, GRAY]
    work_type:
      name: Work type
      options: [Epic, Feature, Experiment, Bug, Research, Task]
      colors: [PURPLE, BLUE, GREEN, RED, YELLOW, GRAY]

# Governor's package preflight runs every project (governor#967); an empty table takes its defaults: the cheap
# check (`just check`) and the tests of the changed files, with CI as the verdict.
preflight: {}
